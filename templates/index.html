<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVU Cloud Application - Jordan Naegle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --uvu-green: #275D38;
      --uvu-green-light: #3a8350;
      --uvu-green-glow: rgba(39, 93, 56, 0.45);
      --bg-dark: #0f1412;
      --card-bg: rgba(22, 30, 26, 0.85);
      --border-color: rgba(62, 133, 85, 0.35);
      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top center, #1b2f23 0%, var(--bg-dark) 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px var(--uvu-green-glow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--uvu-green), #48bb78, var(--uvu-green));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(39, 93, 56, 0.3);
      border: 1px solid var(--uvu-green-light);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #86efac;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #ffffff;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .info-item {
      background: rgba(15, 23, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .info-item:hover {
      border-color: var(--uvu-green-light);
    }

    .info-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .info-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
    }

    .student-id {
      color: #86efac;
      letter-spacing: 0.08em;
    }

    .status-box {
      background: rgba(39, 93, 56, 0.2);
      border: 1px dashed var(--uvu-green-light);
      border-radius: 12px;
      padding: 1rem;
      font-size: 0.9rem;
      color: #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <span class="pulse-dot"></span>
      UVU Cloud Deployment
    </div>

    <h1>{{ student.name }}</h1>
    <p class="subtitle">{{ student.university }} &bull; {{ student.course }}</p>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Full Name</span>
        <span class="info-val">{{ student.name }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">UVU Student ID</span>
        <span class="info-val student-id">{{ student.student_id }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Environment</span>
        <span class="info-val">Docker on Linux VM</span>
      </div>
    </div>

    <div class="status-box">
      <span>&#9729;&#65039; Status:</span>
      <strong>{{ student.status }}</strong>
    </div>
  </div>

  <footer>
    Utah Valley University &bull; Wolverine Green &bull; Fall 2026
  </footer>
</body>
</html>
